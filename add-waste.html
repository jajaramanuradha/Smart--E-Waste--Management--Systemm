{% extends "base.html" %}{% block title %}Add Waste - Smart E-Waste{% endblock %}{% block content %}<section class="page-header"><h1>Register E-Waste</h1><p>Add an electronic waste item to the system.</p></section><div class="form-card"><form method="POST"><label>Item Name</label><input type="text" name="item_name" placeholder="Example: Old Laptop" required><label>Category</label><select name="category" required><option value="">Select category</option><option>Mobile Phone</option><option>Laptop</option><option>Computer</option><option>Battery</option><option>Printer</option><option>Monitor</option><option>Accessories</option><option>Other</option></select><label>Condition</label><select name="condition" required><option value="">Select condition</option><option>Working</option><option>Repairable</option><option>Damaged</option></select><label>Quantity</label><input type="number" name="quantity" min="1" value="1" required><button type="submit" class="btn">Add E-Waste</button></form></div>{% endblock %}
